name: Publish fork release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.13.0)"
        required: true
        type: string

permissions:
  contents: write
  # Required for npm provenance. Provenance comes from the Actions OIDC token,
  # not from how npm is authenticated, so it works with NPM_TOKEN as well as
  # with a trusted publisher.
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  verify:
    if: github.repository == 'phall1/phui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run package:smoke

      - name: Verify release tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${RELEASE_TAG}"

  standalone:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build:standalone -- ${{ matrix.target }}

      - name: Upload standalone release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "dist/release/phui-${{ matrix.target }}.tar.gz" "dist/release/phui-${{ matrix.target }}.tar.gz.sha256" --clobber

      # Reuses the binary built above rather than compiling it a second time.
      - run: bun run build:npm-packages -- ${{ matrix.target }}
        env:
          PHUI_REUSE_RELEASE_BINARY: "1"

      - name: Publish npm binary package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN is not set; published binaries and the Homebrew formula only."
            exit 0
          fi
          package_dir="dist/npm/binaries/${{ matrix.target }}"
          name="$(node -p "require('./${package_dir}/package.json').name")"
          version="$(node -p "require('./${package_dir}/package.json').version")"
          # Re-running a release must not fail on packages that already landed.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published."
            exit 0
          fi
          npm publish "${package_dir}"

  # The wrapper package, published last: it lists every binary package as an
  # optionalDependency, so publishing it before they exist would leave a window
  # where `npm i -g @phall1/phui` installs a launcher with nothing to launch.
  npm-main:
    needs: standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build:npm-packages -- main

      - run: npm pack --dry-run
        working-directory: dist/npm/main

      - name: Publish npm package
        working-directory: dist/npm/main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN is not set; published binaries and the Homebrew formula only."
            exit 0
          fi
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published."
            exit 0
          fi
          npm publish

  update-homebrew:
    needs: standalone
    runs-on: ubuntu-latest
    steps:
      - name: Download standalone checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/release
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "*.sha256" --dir dist/release

      - name: Update phall1 Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          : "${GH_TOKEN:?Set HOMEBREW_TAP_TOKEN with access to phall1/homebrew-tap}"
          cat dist/release/*.sha256 > dist/release/checksums.txt
          checksum() {
            awk -v file="$1" '$2 == file { print $1 }' dist/release/checksums.txt
          }
          gh api --method POST repos/phall1/homebrew-tap/dispatches \
            -f event_type=phui-release \
            -f client_payload[tag]="${RELEASE_TAG}" \
            -f client_payload[version]="${RELEASE_TAG#v}" \
            -f client_payload[darwin_arm64_sha256]="$(checksum phui-darwin-arm64.tar.gz)" \
            -f client_payload[darwin_x64_sha256]="$(checksum phui-darwin-x64.tar.gz)" \
            -f client_payload[linux_arm64_sha256]="$(checksum phui-linux-arm64.tar.gz)" \
            -f client_payload[linux_x64_sha256]="$(checksum phui-linux-x64.tar.gz)"
