name: Publish fork release

# Reachable only through release-please.yml. npm's trusted publishing validates
# the calling workflow's filename, so a second entry point here would be a path
# that silently cannot authenticate — see the header of that file.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.14.1)"
        required: true
        type: string

permissions:
  contents: write
  # Mints the OIDC token. npm uses it for provenance, and — once a trusted
  # publisher is registered — for authentication itself, in preference to any
  # token that happens to be set.
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    if: github.repository == 'phall1/phui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      # `registry-url` is what makes setup-node write the .npmrc that reads
      # NODE_AUTH_TOKEN. Without it npm ignores the token entirely and every
      # authenticated command fails with ENEEDAUTH.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run package:smoke

      - name: Verify release tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${RELEASE_TAG}"

      # npm reports "you cannot publish here" as `404 Not Found - PUT`, because
      # it will not leak whether a scope exists — indistinguishable from a
      # typo'd name, and it costs a whole release to learn nothing. Resolve what
      # the failure hides up front, before four binaries get built.
      - name: Report npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          name="$(node -p "require('./package.json').name")"
          scope="${name%%/*}"; scope="${scope#@}"

          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            oidc=yes
            echo "OIDC:      available — npm prefers trusted publishing over any token"
          else
            oidc=no
            echo "::warning title=OIDC unavailable::No id-token permission reached this job; npm can only fall back to a token."
          fi

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then token=yes; else token=no; fi
          echo "NPM_TOKEN: ${token}"
          echo "package:   ${name} (scope @${scope})"

          if [ "$oidc" = no ] && [ "$token" = no ]; then
            echo "::error title=No npm credentials::Neither OIDC nor NPM_TOKEN is available; publishing cannot succeed."
            exit 1
          fi

          # Only meaningful for the token path. Under trusted publishing there
          # is no account to ask about, so a mismatch here is not fatal.
          if [ "$token" = yes ]; then
            if who="$(npm whoami 2>&1)"; then
              echo "token is:  ${who}"
              if [ "$who" != "$scope" ]; then
                echo "::warning title=Token account does not own this scope::Authenticated as '${who}' but the package is '@${scope}'. Fine if trusted publishing handles the publish; fatal if it falls back to this token."
              fi
            else
              echo "::warning title=NPM_TOKEN is not usable::npm whoami failed: ${who}"
            fi
          fi

  standalone:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm >= 11.5.1. Node 24 currently bundles a
      # new enough npm, but "currently" is not a guarantee worth a broken
      # release, and the upgrade is skipped when it is already satisfied.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          need=11.5.1
          have="$(npm -v)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm ${have} is older than ${need}; upgrading."
            npm install -g npm@latest
          fi
          npm -v

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build:standalone -- ${{ matrix.target }}

      - name: Upload standalone release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "dist/release/phui-${{ matrix.target }}.tar.gz" "dist/release/phui-${{ matrix.target }}.tar.gz.sha256" --clobber

      # Reuses the binary built above rather than compiling it a second time,
      # so npm ships the exact bytes the release tarball and Homebrew do.
      - run: bun run build:npm-packages -- ${{ matrix.target }}
        env:
          PHUI_REUSE_RELEASE_BINARY: "1"

      - name: Publish npm binary package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package_dir="dist/npm/binaries/${{ matrix.target }}"
          name="$(node -p "require('./${package_dir}/package.json').name")"
          version="$(node -p "require('./${package_dir}/package.json').version")"
          # Re-running a release must not fail on packages that already landed.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published."
            exit 0
          fi
          npm publish "${package_dir}"

  # The wrapper package, published last: it lists every binary package as an
  # optionalDependency, so publishing it before they exist would leave a window
  # where `npm i -g @phall/phui` installs a launcher with nothing to launch.
  npm-main:
    needs: standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          need=11.5.1
          have="$(npm -v)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            npm install -g npm@latest
          fi
          npm -v

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build:npm-packages -- main

      - run: npm pack --dry-run
        working-directory: dist/npm/main

      - name: Publish npm package
        working-directory: dist/npm/main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published."
            exit 0
          fi
          npm publish

  # A green `npm publish` is not proof anyone can install the thing. It says
  # nothing about whether the registry has caught up, whether the wrapper
  # resolves the right platform package, or whether the binary inside actually
  # runs on that platform. Install it the way a user would, on every platform
  # published, and run it.
  verify-published:
    needs: npm-main
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: macos-15-intel
          - runner: ubuntu-24.04-arm
          - runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install from the registry and run it
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          # A newly published scoped package is not immediately readable; the
          # write succeeds well before the read path catches up.
          for attempt in $(seq 1 30); do
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "registry served ${name}@${version} after $(( (attempt - 1) * 20 ))s"
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error title=Published package never became readable::${name}@${version} was still 404 after 10 minutes."
              exit 1
            fi
            sleep 20
          done

          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund "${name}@${version}"

          got="$(./node_modules/.bin/phui --version)"
          echo "phui --version -> ${got}"
          test "${got}" = "${version}"
