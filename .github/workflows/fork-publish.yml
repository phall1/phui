name: Publish fork release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.13.0)"
        required: true
        type: string
  # Re-publish an existing tag without cutting a new release. Publishing can
  # fail for reasons that have nothing to do with the code — an expired token,
  # a registry outage — and re-running a release's jobs is not always possible
  # once the run has aged out.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.14.1)"
        required: true
        type: string

permissions:
  contents: write
  # Required for npm provenance. Provenance comes from the Actions OIDC token,
  # not from how npm is authenticated, so it works with NPM_TOKEN as well as
  # with a trusted publisher.
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  verify:
    if: github.repository == 'phall1/phui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      # `registry-url` is what makes setup-node write the .npmrc that reads
      # NODE_AUTH_TOKEN. Without it npm ignores the token entirely and every
      # authenticated command fails with ENEEDAUTH, which is exactly what the
      # credential preflight below hit the first time it ran.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run package:smoke

      - name: Verify release tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${RELEASE_TAG}"

      # npm answers "cannot publish here" with `404 Not Found - PUT`, because it
      # will not leak whether a scope exists. That is indistinguishable from a
      # typo'd package name, and it costs a whole release to learn nothing. So
      # resolve the one fact the 404 hides — who the token actually is — before
      # building four binaries, and say plainly how it disagrees with the scope
      # being published to.
      - name: Check npm credentials against the package scope
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning title=npm publish will be skipped::NPM_TOKEN is not set."
            exit 0
          fi

          name="$(node -p "require('./package.json').name")"
          scope="${name%%/*}"
          scope="${scope#@}"

          if ! who="$(npm whoami 2>&1)"; then
            echo "::error title=npm token is not usable::npm whoami failed: ${who}"
            exit 1
          fi
          echo "npm authenticated as: ${who}"
          echo "publishing scope:     @${scope}"

          if [ "$who" != "$scope" ]; then
            echo "::error title=npm scope does not match the token's account::Authenticated as '${who}' but publishing to '@${scope}'. A personal npm scope only exists for the account whose username matches it, and publishing into someone else's scope fails as a 404, not a permission error. Either rename the package to @${who}/... or use a token for an account that owns @${scope}."
            exit 1
          fi

          # Ownership of the scope is not the same as permission to create new
          # packages in it: a granular token restricted to selected packages can
          # read everything and still publish nothing.
          echo "Scope matches the authenticated account."

  standalone:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build:standalone -- ${{ matrix.target }}

      - name: Upload standalone release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "dist/release/phui-${{ matrix.target }}.tar.gz" "dist/release/phui-${{ matrix.target }}.tar.gz.sha256" --clobber

      # Reuses the binary built above rather than compiling it a second time.
      - run: bun run build:npm-packages -- ${{ matrix.target }}
        env:
          PHUI_REUSE_RELEASE_BINARY: "1"

      - name: Publish npm binary package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN is not set; published binaries and the Homebrew formula only."
            exit 0
          fi
          package_dir="dist/npm/binaries/${{ matrix.target }}"
          name="$(node -p "require('./${package_dir}/package.json').name")"
          version="$(node -p "require('./${package_dir}/package.json').version")"
          # Re-running a release must not fail on packages that already landed.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published."
            exit 0
          fi
          npm publish "${package_dir}"

  # The wrapper package, published last: it lists every binary package as an
  # optionalDependency, so publishing it before they exist would leave a window
  # where `npm i -g @phall/phui` installs a launcher with nothing to launch.
  npm-main:
    needs: standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build:npm-packages -- main

      - run: npm pack --dry-run
        working-directory: dist/npm/main

      - name: Publish npm package
        working-directory: dist/npm/main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN is not set; published binaries and the Homebrew formula only."
            exit 0
          fi
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published."
            exit 0
          fi
          npm publish

  update-homebrew:
    needs: standalone
    # Runs even when `standalone` failed, because npm publishing lives in that
    # job and an npm problem must not hold Homebrew hostage. The release assets
    # are uploaded before anything npm-related runs, so by this point they
    # exist. If the build genuinely failed and they do not, the tap refuses the
    # update on its own — it verifies every asset before rendering a formula —
    # so the worst case is the formula staying where it is.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Just a ping. The tap re-resolves this release and recomputes every
      # digest from the assets it downloads — it has to, since a payload is only
      # as trustworthy as whoever sent it — so the four checksums this job used
      # to gather and forward were never read by anything.
      #
      # The tap also polls hourly, so a failure here (an expired
      # HOMEBREW_TAP_TOKEN, most likely) delays the formula rather than
      # stranding it.
      - name: Tell the phall1 tap to pick up this release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          : "${GH_TOKEN:?Set HOMEBREW_TAP_TOKEN with access to phall1/homebrew-tap}"
          gh api --method POST repos/phall1/homebrew-tap/dispatches \
            -f event_type=tap-release \
            -f client_payload[tool]=phui
