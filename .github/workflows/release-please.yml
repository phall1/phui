name: Release Please

# The single entry point for publishing.
#
# npm's trusted publishing validates the *calling* workflow's filename when a
# publish happens inside a reusable workflow, so every path that publishes has
# to come through this file — including a manual re-publish. Registering a
# trusted publisher for `fork-publish.yml` would never match, because npm sees
# this workflow's name in the OIDC claim, not that one's.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Re-publish an existing release tag (e.g. v0.14.1). Leave blank to just reconcile the release PR."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # Skipped when re-publishing: that path wants the publish jobs only, and
  # asking release-please to run would just reopen the release PR.
  release-please:
    if: github.repository == 'phall1/phui' && inputs.publish_tag == ''
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # Releases created with the workflow's GITHUB_TOKEN do not emit a
  # `release: published` event, so the publish workflow is called directly.
  #
  # `!cancelled()` rather than `success()` because release-please is skipped on
  # the re-publish path; a genuine release-please failure still leaves
  # `release_created` empty, so this stays skipped.
  publish:
    needs: release-please
    if: ${{ !cancelled() && (inputs.publish_tag != '' || needs.release-please.outputs.release_created == 'true') }}
    # A called workflow cannot grant itself permissions the caller does not
    # have, so `id-token: write` has to be here as well as in fork-publish.yml.
    # It is what mints the OIDC token for both npm provenance and trusted
    # publishing; without it npm silently falls back to a token.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/fork-publish.yml
    with:
      tag: ${{ inputs.publish_tag != '' && inputs.publish_tag || needs.release-please.outputs.tag_name }}
    secrets: inherit
