# ghui — Projects surface configuration
#
# Copy this file to $XDG_CONFIG_HOME/ghui/projects.toml
# (fallback: ~/.config/ghui/projects.toml), then edit the values below.
# Nothing here is read unless you create that file; ghui never guesses a
# directory to scan.
#
# Override the location with GHUI_PROJECTS_CONFIG_PATH=/path/to/projects.toml
# Disable file loading entirely with GHUI_PROJECTS_CONFIG_PATH=off

# Directories to scan. `~` is expanded. Required — with no roots the Projects
# surface just shows a hint pointing back at this file.
roots = ["~/code"]
# roots = ["~/code", "~/src", "/opt/work"]
#
# Environment override (wins over this file), colon or comma separated:
#   GHUI_PROJECTS_ROOTS=~/code:~/src

# Directory names to skip while scanning. Optional.
exclude = ["archive", "node_modules", "vendor"]

# Days without a commit before a repository counts as "stale". Default: 14.
# Env override: GHUI_PROJECTS_STALE_DAYS
staleDays = 14

# How deep below each root to look for projects.
# 1 = a root's immediate children (the common layout). Default: 1, max: 6.
# Env override: GHUI_PROJECTS_MAX_DEPTH
maxDepth = 1

# Your notes about what each project IS. Keyed by the project's directory name.
# lifecycle: "alive" | "parked" | "shipped" | "dead"
# note:      free text, shown next to the project
#
# [intent.example-app]
# lifecycle = "alive"
# note = "main side project"
#
# [intent.old-prototype]
# lifecycle = "dead"
# note = "kept for reference only"
#
# Shorthand: a bare lifecycle string also works.
# [intent]
# scratch = "parked"
